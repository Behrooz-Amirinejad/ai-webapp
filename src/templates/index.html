<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Style Upload</title>
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
      background-color: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background-color: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 400px;
      text-align: center;
    }

    input[type="file"] {
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      resize: none;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
      font-size: 1rem;
    }

    button {
      padding: 10px 20px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background-color: #3730a3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Upload a File & Chat</h2>
    <input type="file" id="fileInput" />
    <textarea id="messageInput" placeholder="Type your message..."></textarea>
    <br />
    <button onclick="handleSubmit()">Submit</button>
  </div>

  <script>
    function handleSubmit() {
      const file = document.getElementById('fileInput').files[0];
      const message = document.getElementById('messageInput').value;

      if (file) {
        console.log('File:', file.name);
      } else {
        console.log('No file selected');
      }

      console.log('Message:', message);

      // You could now send this data via fetch() to your backend server
    }
  </script>

</body>
</html>
